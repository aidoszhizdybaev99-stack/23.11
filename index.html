<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Погода</title>
		<link rel="stylesheet" href="/client/style.css" />
	</head>
	<body>
		<main>
			<h1>Погода</h1>

			<form id="search" role="search">
				<input
					id="query"
					type="search"
					placeholder="Введите город"
					aria-label="Город"
					autocomplete="off"
					required
					minlength="2"
				/>
				<button type="submit">Найти</button>
			</form>
			<ul id="results" hidden></ul>

			<p id="status" role="status"></p>

			<section id="weather" hidden>
				<h2 id="place"></h2>
				<div class="now">
					<span id="icon" aria-hidden="true"></span>
					<span id="temp"></span>
				</div>
				<p id="summary"></p>
				<dl>
					<div>
						<dt>Ощущается</dt>
						<dd id="feels"></dd>
					</div>
					<div>
						<dt>Влажность</dt>
						<dd id="humidity"></dd>
					</div>
					<div>
						<dt>Ветер</dt>
						<dd id="wind"></dd>
					</div>
				</dl>
				<h3>Прогноз на 7 дней</h3>
				<ul id="days"></ul>
			</section>

			<footer>
				Данные: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>
			</footer>
		</main>
		<script type="module" src="/client/main.ts"></script>
	</body>
</html>
